[package]
name = "nsound"
version = "0.1.0"
edition = "2021"
authors = ["nSound Developer"]
description = "Automatic media pausing on voice activity detection in communicators"

[dependencies]
eframe = "0.28"
egui = "0.28"
image = { version = "0.25", default-features = false, features = ["png"] }
sysinfo = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = "0.3"

[build-dependencies]
winres = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Media_Control",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_UI_Input_KeyboardAndMouse"
] }
